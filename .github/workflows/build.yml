name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$SDK/licenses/android-sdk-license" > /dev/null
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$SDK/licenses/android-sdk-preview-license" > /dev/null
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Show the errors (copy these)
        if: failure()
        run: |
          grep -nE "^e: |error:|What went wrong|Could not |FAILED" -A3 build.log | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        with: { name: PillTack-debug-apk, path: app/build/outputs/apk/debug/*.apk }